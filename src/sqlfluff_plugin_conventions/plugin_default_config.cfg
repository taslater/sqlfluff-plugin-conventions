# Default configuration for sqlfluff-plugin-conventions.
#
# Every rule is inert with these values. The plugin ships no naming opinions:
# a team switches on the rules it wants and supplies the patterns. See the
# examples/ directory for starting points.

[sqlfluff:rules:conventions.type_naming]
type_patterns =
type_origins = declaration, cast

[sqlfluff:rules:conventions.identifier_case]
case_convention = snake
case_columns = False
case_tables = False

[sqlfluff:rules:conventions.identifier_length]
max_identifier_length = 0

[sqlfluff:rules:conventions.forbidden_name]
forbidden_patterns =
forbidden_columns = True
forbidden_tables = True

[sqlfluff:rules:conventions.object_name]
object_patterns =

[sqlfluff:rules:conventions.require_qualified_names]
qualified_name_min_parts = 0

[sqlfluff:rules:conventions.require_comment]
require_table_comments = False
require_column_comments = False
comment_min_length = 1
comment_forbidden_patterns =

[sqlfluff:rules:conventions.require_table_properties]
required_property_keys =
required_property_values =

[sqlfluff:rules:conventions.require_table_provider]
allowed_providers =
require_explicit_provider = False

[sqlfluff:rules:conventions.require_table_design]
require_cluster_by = False
require_partition_by = False
allow_cluster_by_auto = True

[sqlfluff:rules:conventions.require_constraints]
require_primary_key = False
require_not_null = False

[sqlfluff:rules:conventions.type_policy]
forbidden_types =
types_requiring_parameters =

[sqlfluff:rules:conventions.comment_quality]
comment_score_function =
comment_score_threshold =
comment_score_columns = True
comment_score_tables = False

[sqlfluff:rules:conventions.no_select_star]
force_enable = False
allow_qualified_star = False

[sqlfluff:rules:conventions.drop_requires_if_exists]
force_enable = False

[sqlfluff:rules:conventions.insert_requires_column_list]
force_enable = False

[sqlfluff:rules:conventions.delete_without_where]
force_enable = False

[sqlfluff:rules:conventions.update_without_where]
force_enable = False
