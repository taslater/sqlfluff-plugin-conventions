rule: Conventions_M001
configs:
  core:
    dialect: databricks
  rules:
    conventions.require_comment:
      require_table_comments: True
      require_column_comments: True
      comment_min_length: 1
      comment_forbidden_patterns: "^(todo|tbd|n/?a)$"

fully_commented:
  pass_str: |
    CREATE TABLE users (
        id BIGINT COMMENT 'Surrogate key',
        email STRING COMMENT 'Primary contact'
    ) COMMENT 'Registered users'

missing_table_comment:
  fail_str: CREATE TABLE users (id BIGINT COMMENT 'Surrogate key') COMMENT ''

missing_column_comment:
  fail_str: CREATE TABLE users (id BIGINT, email STRING COMMENT 'Primary contact') COMMENT 'Registered users'

placeholder_comment_is_case_insensitive:
  fail_str: CREATE TABLE users (id BIGINT COMMENT 'TODO') COMMENT 'Registered users'

missing_column_comment_on_view:
  fail_str: CREATE VIEW v (a COMMENT 'column a', b) COMMENT 'view doc' AS SELECT 1

minimum_length:
  configs:
    core:
      dialect: databricks
    rules:
      conventions.require_comment:
        require_column_comments: True
        comment_min_length: 10
  fail_str: CREATE TABLE users (id BIGINT COMMENT 'short')

meets_minimum_length:
  configs:
    core:
      dialect: databricks
    rules:
      conventions.require_comment:
        require_column_comments: True
        comment_min_length: 10
  pass_str: CREATE TABLE users (id BIGINT COMMENT 'long enough for anyone')

table_comments_can_be_disabled:
  configs:
    core:
      dialect: databricks
    rules:
      conventions.require_comment:
        require_table_comments: False
        require_column_comments: False
  pass_str: CREATE TABLE users (id BIGINT)

comment_on_table_satisfies:
  pass_str: |
    CREATE TABLE users (id BIGINT COMMENT 'Surrogate key');
    COMMENT ON TABLE users IS 'Registered users'

comment_on_column_satisfies:
  pass_str: |
    CREATE TABLE users (id BIGINT) COMMENT 'Registered users';
    COMMENT ON COLUMN users.id IS 'Surrogate key from the identity pool'

comment_on_qualified_column_satisfies:
  pass_str: |
    CREATE TABLE prod.sales.users (id BIGINT) COMMENT 'Registered users';
    COMMENT ON COLUMN prod.sales.users.id IS 'Surrogate key'

alter_column_comment_satisfies:
  pass_str: |
    CREATE TABLE users (id BIGINT) COMMENT 'Registered users';
    ALTER TABLE users ALTER COLUMN id COMMENT 'Surrogate key'

comment_on_an_uncreated_object_is_ignored:
  fail_str: |
    CREATE TABLE users (id BIGINT) COMMENT 'Registered users';
    COMMENT ON TABLE other_table IS 'not this file''s problem'

comment_on_another_schema_still_matches_by_name:
  pass_str: |
    CREATE TABLE users (id BIGINT);
    COMMENT ON TABLE default.users IS 'Registered users';
    COMMENT ON COLUMN default.users.id IS 'Surrogate key'

table_comments_only_config:
  configs:
    core:
      dialect: databricks
    rules:
      conventions.require_comment:
        require_table_comments: True
        require_column_comments: False
  pass_str: CREATE TABLE users (id BIGINT COMMENT 'Surrogate key') COMMENT 'Registered users'

comment_exactly_at_minimum_length_passes:
  configs:
    core:
      dialect: databricks
    rules:
      conventions.require_comment:
        require_column_comments: True
        comment_min_length: 10
  pass_str: CREATE TABLE users (id BIGINT COMMENT '0123456789')
