[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlfluff-plugin-conventions"
version = "0.2.0"
description = "Config-driven team conventions for SQLFluff: type-aware column naming, required comments, naming and anti-pattern rules."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Slater" }]
keywords = ["sqlfluff", "sql", "linter", "conventions", "databricks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["sqlfluff>=4.3.0"]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/taslater/sqlfluff-plugin-conventions"

[project.entry-points.sqlfluff]
conventions = "sqlfluff_plugin_conventions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqlfluff_plugin_conventions = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
files = ["src", "test", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
no_implicit_reexport = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
