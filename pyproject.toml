[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlfluff-plugin-conventions"
version = "0.2.0"
description = "Config-driven team conventions for SQLFluff: type-aware column naming, required comments, naming and anti-pattern rules."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Slater" }]
keywords = ["sqlfluff", "sql", "linter", "conventions", "databricks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["sqlfluff>=4.3.0"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=5", "hypothesis>=6.100"]
dev = [
    "pytest>=7",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mutmut>=3.2",
    "pip-tools>=7.4",
    "pip-audit>=2.7",
    "ruff>=0.4",
    "mypy>=1.8",
    "setuptools>=77",
]

[project.urls]
Homepage = "https://github.com/taslater/sqlfluff-plugin-conventions"

[project.entry-points.sqlfluff]
conventions = "sqlfluff_plugin_conventions"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqlfluff_plugin_conventions = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
branch = true
source = ["sqlfluff_plugin_conventions"]

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src/sqlfluff_plugin_conventions/"]
pytest_add_cli_args_test_selection = ["test/"]

[tool.mypy]
files = ["src", "test", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
no_implicit_reexport = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["S101", "S603", "S607"]
# Generated golden file: long rule lists and descriptions are intentional.
"test/test_golden.py" = ["E501"]
"scripts/*" = ["S603", "S607", "T201"]
# Plugin rules use SQLFluff's plain class-attribute style.
"src/sqlfluff_plugin_conventions/rules/*" = ["RUF012"]
# Asserts in these modules are deliberate invariants (parse-tree guarantees
# and guarded state), documented in place.
"src/sqlfluff_plugin_conventions/semantics.py" = ["S101"]
"src/sqlfluff_plugin_conventions/rules/metadata.py" = ["S101"]
